[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarship-watchdog"
version = "0.1.0"
description = "Weekly autonomous watch over scholarship deadlines, scored against a private eligibility profile."
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27,<1.0",
    "trafilatura>=1.12,<2.0",
    "pydantic>=2.8,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
scholarship-watchdog = "scholarship_watchdog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarship_watchdog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
